function downloadBackup() {
  const blob = new Blob([JSON.stringify({
    config: state.config, pending_dues: state.pending_dues,
    readings: state.readings, manual_flags: state.manual_flags,
    watchman_images: state.watchman_images, monthly: state.monthly,
    payments: state.payments,
    backup_version: 2, created: new Date().toISOString()
  }, null, 2)], { type: 'application/json' });

function handleBackupFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || typeof data !== 'object' || (!data.monthly && !data.readings)) throw new Error('bad');
      const nM = Object.keys(data.monthly || {}).length, nR = Object.keys(data.readings || {}).length;
      if (!confirm(`Restore backup from ${data.created ? new Date(data.created).toLocaleString('en-IN') : 'unknown date'}?\n\n${nM} months · ${nR} months of readings · ${Object.keys(data.watchman_images || {}).length} photos\n\nThis replaces the data on this phone.`)) return;
      ['config', 'pending_dues', 'readings', 'manual_flags', 'watchman_images', 'monthly', 'payments'].forEach(k => {
        if (data[k] !== undefined) state[k] = data[k];
      });
      if (!state.payments) state.payments = {};
      if (!state.watchman_images) state.watchman_images = {};
      if (!state.manual_flags) state.manual_flags = {};
      saveState();
      await persistAllImages();
      setMeta({ lastBackup: Date.now() });
      entryState = null;
      state.ui.selected_month = listMonths()[0] || todayYM();
      document.querySelector('.brand-name').textContent = state.config.society_name;
      toast(`Restored ${nM} months ✓`, 'success');
      navigate('dashboard');
    } catch (err) { console.error(err); toast('Invalid backup file', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ==================================================================== */
/* PHONE STORAGE — photos live in IndexedDB (much larger than           */
/* localStorage), everything else stays in localStorage as before.      */
/* ==================================================================== */
const IMG_DB = 'lotus_parimal_images';
const META_KEY = 'lotus_parimal_meta';
const AI_KEY_STORE = 'lotus_parimal_ai';   // AI key: this phone only, never in backups

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(IMG_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('images');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbTx(mode, fn) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images', mode);
    const store = tx.objectStore('images');
    const out = fn(store);
    tx.oncomplete = () => { db.close(); resolve(out && out.result !== undefined ? out.result : out); };
    tx.onerror = () => { db.close(); reject(tx.error); };
    tx.onabort = () => { db.close(); reject(tx.error); };
  });
}
function idbPutImage(ym, dataUrl) { return idbTx('readwrite', s => s.put(dataUrl, ym)); }
function idbDeleteImage(ym) { return idbTx('readwrite', s => s.delete(ym)); }
function idbClearImages() { return idbTx('readwrite', s => s.clear()); }
async function idbAllImages() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const out = {};
    const tx = db.transaction('images', 'readonly');
    const req = tx.objectStore('images').openCursor();
    req.onsuccess = () => {
      const c = req.result;
      if (c) { out[c.key] = c.value; c.continue(); }
    };
    tx.oncomplete = () => { db.close(); resolve(out); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function persistAllImages() {
  try {
    await idbClearImages();
    for (const [ym, url] of Object.entries(state.watchman_images || {})) {
      if (url) await idbPutImage(ym, url);
    }
  } catch (e) { console.error(e); toast('Could not save photos: ' + e.message, 'error'); }
}
async function loadImagesFromDB() {
  try {
    const imgs = await idbAllImages();
    state.watchman_images = Object.assign({}, imgs, state.watchman_images || {});
  } catch (e) { console.error('image load', e); }
}

function getMeta() { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch (e) { return {}; } }
function setMeta(patch) { try { localStorage.setItem(META_KEY, JSON.stringify({ ...getMeta(), ...patch })); } catch (e) {} }
function getAI() { try { return JSON.parse(localStorage.getItem(AI_KEY_STORE)) || {}; } catch (e) { return {}; } }
function setAI(patch) { try { localStorage.setItem(AI_KEY_STORE, JSON.stringify({ ...getAI(), ...patch })); } catch (e) {} }

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function shareOrSave(blob, filename, title) {
  try {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title });
      return 'shared';
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return 'cancelled';
  }
  downloadBlob(blob, filename);
  return 'saved';
}

/* ==================================================================== */
/* IMAGE HELPERS                                                        */
/* ==================================================================== */
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not open this image'));
    img.src = src;
  });
}
/* Shrink big phone photos (12 MP → ~1800 px) so storage and AI reading stay fast */
async function shrinkImage(dataUrl, maxSide = 1800, quality = 0.85) {
  const img = await loadImage(dataUrl);
  const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
  if (scale === 1 && dataUrl.length < 900000) return dataUrl;
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * scale);
  c.height = Math.round(img.height * scale);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

/* ==================================================================== */
/* AI METER-SHEET READER (Google Gemini vision)                         */
/* ==================================================================== */
const AI_DEFAULT_MODEL = 'gemini-flash-latest';
const AI_FALLBACK_MODELS = ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.0-flash'];

function normalizeFlat(raw) {
  if (raw == null) return null;
  let s = String(raw).toUpperCase().replace(/[\s\-_.:]/g, '');
  s = s.replace(/^FLAT/, '');
  if (FLATS.includes(s)) return s;
  // Ground floor written as G1 / G-1 / GR1 / C1 / 61 / 601
  let m = s.match(/^(?:G|GR|C|6)0?([1-6])$/);
  if (m) return 'G0' + m[1];
  m = s.match(/^([1-4])0?([1-6])$/);
  if (m && FLATS.includes(m[1] + '0' + m[2])) return m[1] + '0' + m[2];
  return null;
}

function median(arr) {
  if (!arr.length) return 0;
  const a = arr.slice().sort((x, y) => x - y);
  const mid = Math.floor(a.length / 2);
  return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
}

/* Typical monthly meter increase for a flat, from the last 6 months on record */
function typicalIncrease(flat, ym) {
  const diffs = [];
  let cur = prevMonth(ym);
  for (let i = 0; i < 7 && cur; i++) {
    const p = prevMonth(cur);
    const a = state.readings[cur]?.[flat], b = state.readings[p]?.[flat];
    if (a != null && b != null && a >= b) diffs.push(a - b);
    cur = p;
  }
  return median(diffs);
}

/* Check every AI reading against last month & the flat's usual usage */
function validateAIReadings(ym, aiMap, uncertainSet) {
  const prev = state.readings[prevMonth(ym)] || {};
  const rows = [];
  FLATS.forEach(flat => {
    const v = aiMap[flat];
    const p = prev[flat];
    const typ = typicalIncrease(flat, ym);
    const reasons = [];
    if (v == null) reasons.push('Not found on the sheet');
    else {
      if (p != null && v < p) reasons.push(`Lower than last month (${fmtNum(p)})`);
      if (p != null && String(Math.round(v)).length !== String(Math.round(p)).length && Math.abs(v - p) > 2000)
        reasons.push('Digit count differs from last month');
      if (p != null && v >= p) {
        const d = v - p;
        const limit = Math.max(typ * 4, typ + 1500, 1500);
        if (d > limit) reasons.push(`Very high use: +${fmtNum(d)} (usual ~${fmtNum(Math.round(typ))})`);
      }
      if (uncertainSet.has(flat)) reasons.push('AI was unsure of a digit');
    }
    rows.push({ flat, prev: p, value: v, usage: (v != null && p != null) ? (v - p) * 10 : null, reasons });
  });
  return rows;
}

function buildAIPrompt(ym) {
  const prev = state.readings[prevMonth(ym)] || {};
  const prevList = FLATS.map(f => `${f}: ${prev[f] != null ? prev[f] : 'unknown'}`).join(', ');
  return `You are reading a photo of a handwritten water-meter register page from an Indian apartment building ("${state.config.society_name}").

The page lists each flat's meter reading for ${ymToLabel(ym)}, written by the watchman as "<flat> - <reading>" (for example "203 - 48725").
Valid flats (27): ${FLATS.join(', ')}.
- Ground-floor flats G01–G06 are usually written like "G1", "G-1", "Gr 1", "C1" or "G01". Return them as G01…G06.
- Readings are whole numbers, normally 4 to 6 digits.

Rules:
1. Read exactly what is written for each flat. Return one entry per flat that has a reading on the page.
2. Ignore titles, dates, and any checklist column of flat numbers that has no reading or is crossed out.
3. If a reading is struck through and a corrected value is written, use the corrected value.
4. Find the water tanker count if it is on the page (e.g. "Tanker total 55 x 700 = 38500" → tankers_count 55, tanker_rate 700). If an amount is crossed out and rewritten, use the new one.
5. Last month's readings are given ONLY to help you decide an unclear digit (meters only go up, usually by a small amount):
   ${prevList}
   Never copy last month's number; never invent a reading for a flat that is not on the page.
6. Set "uncertain": true for any reading where a digit is smudged, overwritten or hard to read.`;
}

const AI_SCHEMA = {
  type: 'OBJECT',
  properties: {
    month_written: { type: 'STRING' },
    readings: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          flat: { type: 'STRING' },
          reading: { type: 'INTEGER' },
          uncertain: { type: 'BOOLEAN' }
        },
        required: ['flat', 'reading']
      }
    },
    tankers_count: { type: 'INTEGER', nullable: true },
    tanker_rate: { type: 'INTEGER', nullable: true }
  },
  required: ['readings']
};

async function callGemini(model, key, prompt, b64) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
    generationConfig: { temperature: 0, responseMimeType: 'application/json', responseSchema: AI_SCHEMA }
  };
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify(body)
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = json?.error?.message || res.statusText || 'Request failed';
    const err = new Error(msg); err.status = res.status; throw err;
  }
  const text = (json.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!text) throw new Error('The AI returned no answer (' + (json.candidates?.[0]?.finishReason || 'empty') + ')');
  const cleaned = text.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  return JSON.parse(cleaned);
}

function aiErrorText(err) {
  const m = String(err.message || err);
  if (err.status === 400 && /api key/i.test(m)) return 'The API key is not valid. Check it in Settings → AI reader.';
  if (err.status === 403) return 'This API key is not allowed to use Gemini. Create a new key in Google AI Studio.';
  if (err.status === 429) return 'Free daily limit reached for now. Try again later, or type the readings using split view.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No internet connection — the AI reader needs internet.';
  return m;
}

async function readSheetWithAI(ym, imageDataUrl, onStatus) {
  const ai = getAI();
  if (!ai.key) { const e = new Error('NO_KEY'); e.noKey = true; throw e; }
  onStatus && onStatus('Preparing photo…');
  const small = await shrinkImage(imageDataUrl, 1600, 0.88);
  const b64 = small.split(',')[1];
  const prompt = buildAIPrompt(ym);
  const models = [...new Set([ai.model || AI_DEFAULT_MODEL, ...AI_FALLBACK_MODELS])];
  let lastErr;
  for (const model of models) {
    try {
      onStatus && onStatus('Reading the handwriting… (5–20 seconds)');
      const out = await callGemini(model, ai.key, prompt, b64);
      setAI({ lastModel: model });
      return out;
    } catch (e) {
      lastErr = e;
      // Model name not available → try the next one; anything else → stop
      if (!(e.status === 404 || (e.status === 400 && /model/i.test(e.message || '')))) break;
    }
  }
  throw lastErr;
}

function parseAIResult(out) {
  const map = {}, uncertain = new Set();
  (out.readings || []).forEach(r => {
    const flat = normalizeFlat(r.flat);
    const val = Number(String(r.reading).replace(/[^\d]/g, ''));
    if (!flat || !val) return;
    if (map[flat] == null || r.uncertain === false) map[flat] = val;
    if (r.uncertain) uncertain.add(flat);
  });
  return { map, uncertain, tankers: out.tankers_count || null, rate: out.tanker_rate || null };
}

async function runAIReader() {
  if (!entryState?.watchmanImage) { toast('Add the watchman\'s photo first', 'error'); return; }
  const box = document.getElementById('ai-status');
  const btn = document.getElementById('ai-run-btn');
  const say = (html, kind = '') => { if (box) { box.className = 'ai-box ' + kind; box.style.display = 'block'; box.innerHTML = html; } };
  if (btn) btn.disabled = true;
  try {
    const out = await readSheetWithAI(entryState.ym, entryState.watchmanImage, s => say('⏳ ' + s));
    const parsed = parseAIResult(out);
    const rows = validateAIReadings(entryState.ym, parsed.map, parsed.uncertain);
    entryState.aiRows = rows;
    entryState.aiTankers = parsed.tankers;
    entryState.aiRate = parsed.rate;
    const found = rows.filter(r => r.value != null).length;
    const flagged = rows.filter(r => r.reasons.length).length;
    say(`✓ Read <b>${found} of ${FLAT_COUNT}</b> readings${parsed.tankers ? ` and <b>${parsed.tankers} tankers</b>` : ''}. ${flagged ? `<b>${flagged}</b> need a quick check.` : 'All look normal.'}`, 'ok');
    showAIReview();
  } catch (e) {
    if (e.noKey) { showAIKeyHelp(true); say('Set up the free AI reader once to read photos automatically.', ''); }
    else { console.error(e); say('⚠ ' + aiErrorText(e) + '<br><span style="font-size:12px">You can still type readings using <b>Split view</b>.</span>', 'err'); }
  } finally {
    if (btn) btn.disabled = false;
  }
}

function showAIReview() {
  const rows = entryState.aiRows || [];
  const flagged = rows.filter(r => r.reasons.length);
  const t = entryState.aiTankers;
  showModal(`
    <div class="modal-title">AI reading · ${ymToLabel(entryState.ym)}</div>
    <p style="font-size:12.5px;color:var(--c-text-2);margin-bottom:10px;">
      ${flagged.length ? `<b style="color:#b45309">${flagged.length} highlighted</b> — compare these with the photo after filling.` : 'Every reading passed the checks against last month.'}
      ${t ? `<br>Tankers on sheet: <b>${t}</b>${entryState.aiRate ? ' × ₹' + entryState.aiRate : ''}` : ''}
    </p>
    <div class="ai-review-wrap">
      <table class="ai-review">
        <thead><tr><th>Flat</th><th style="text-align:right">Last month</th><th style="text-align:right">AI read</th><th style="text-align:right">Used (L)</th></tr></thead>
        <tbody>
          ${[...flagged, ...rows.filter(r => !r.reasons.length)].map(r => `
            <tr class="${r.reasons.length ? 'flag' : ''}">
              <td><b>${r.flat}</b>${r.reasons.map(x => `<span class="ai-reason">⚠ ${x}</span>`).join('')}</td>
              <td class="num">${r.prev != null ? fmtNum(r.prev) : '—'}</td>
              <td class="num"><b>${r.value != null ? r.value : '—'}</b></td>
              <td class="num">${r.usage != null ? fmtNum(r.usage) : '—'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="applyAIReadings()">✓ Fill ${rows.filter(r => r.value != null).length} readings${t ? ' + tankers' : ''}</button>
    </div>
  `);
}

function applyAIReadings() {
  const rows = entryState.aiRows || [];
  entryState.aiFlags = {};
  rows.forEach(r => {
    if (r.value != null) entryState.readings[r.flat] = r.value;
    if (r.reasons.length) entryState.aiFlags[r.flat] = r.reasons.join(' · ');
  });
  if (entryState.aiTankers) entryState.water.tankers_count = entryState.aiTankers;
  if (entryState.aiRate) entryState.water.tanker_rate = entryState.aiRate;
  entryState.ocrResults = {};
  closeModal();
  if (Object.keys(entryState.aiFlags).length) entryState.splitView = true;
  renderEntry();
  const n = Object.keys(entryState.aiFlags).length;
  toast(n ? `Filled. Check the ${n} highlighted flat${n > 1 ? 's' : ''} against the photo.` : 'All readings filled ✓', 'success');
}

function showAIFlag(flat) {
  const why = entryState?.aiFlags?.[flat];
  if (why) toast(`${flat}: ${why}`);
}

function showAIKeyHelp(fromEntry) {
  const ai = getAI();
  showModal(`
    <div class="modal-title">🤖 AI reader setup (free, one time)</div>
    <p style="font-size:13px;color:var(--c-text-2);">The AI reader uses Google's Gemini to read the watchman's handwriting. You need a free key:</p>
    <ol class="key-steps">
      <li>Open <b>aistudio.google.com</b> in Safari and sign in with your Google account.</li>
      <li>Tap <b>Get API key</b> → <b>Create API key</b>.</li>
      <li>Copy the key (starts with <b>AIza…</b>) and paste it below.</li>
    </ol>
    <div class="field"><label class="field-label">Gemini API key</label>
      <input class="field-input" id="ai-key-input" value="${ai.key ? ai.key : ''}" placeholder="AIza…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <p style="font-size:11.5px;color:var(--c-text-3);">The key is saved only on this phone and is never included in backups. On Google's free tier, photos may be used by Google to improve its AI — they only contain flat numbers and readings.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAIKey(${fromEntry ? 'true' : 'false'})">Save key</button>
    </div>
  `);
}

function saveAIKey(thenRun) {
  const key = (document.getElementById('ai-key-input').value || '').trim();
  if (!key) { toast('Paste the key first', 'error'); return; }
  setAI({ key });
  closeModal();
  toast('AI reader ready ✓', 'success');
  if (state.ui.current_page === 'settings') renderSettings();
  if (thenRun && entryState?.watchmanImage) runAIReader();
}

async function testAIKey() {
  const ai = getAI();
  if (!ai.key) { showAIKeyHelp(false); return; }
  toast('Testing key…');
  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(ai.model || AI_DEFAULT_MODEL)}:generateContent`;
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': ai.key },
      body: JSON.stringify({ contents: [{ parts: [{ text: 'Reply with the single word OK' }] }] }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(j?.error?.message || res.statusText); e.status = res.status; throw e; }
    toast('Key works ✓', 'success');
  } catch (e) { toast(aiErrorText(e), 'error'); }
}

function removeAIKey() {
  if (!confirm('Remove the AI key from this phone?')) return;
  setAI({ key: '' });
  renderSettings();
}

/* ==================================================================== */
/* INSTALL / BACKUP REMINDERS                                           */
/* ==================================================================== */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
let persistedStorage = null;

function needsBackup() {
  const m = getMeta();
  if (!hasAnyData() || !m.lastChange) return false;
  if (!m.lastBackup) return true;
  return m.lastChange > m.lastBackup && (Date.now() - m.lastBackup) > 7 * 86400000;
}
function bannersHTML() {
  let h = '';
  if (!isStandalone() && !getMeta().tipDismissed && window.innerWidth <= 820) {
    h += `<div class="m-banner tip"><div class="mb-icon">📲</div><div class="mb-body"><b>Install as an app</b><div>${isIOS ? 'Tap <b>Share ⬆</b> → <b>Add to Home Screen</b> (keep "Open as Web App" on).' : 'Tap <b>⋮</b> → <b>Add to Home screen</b>.'} Then always open it from the icon — your data stays safely on this phone.</div>
      <div class="mb-actions"><button class="btn btn-secondary btn-small" onclick="setMeta({tipDismissed:true}); renderDashboard();">Got it</button></div></div></div>`;
  }
  if (needsBackup()) {
    const m = getMeta();
    h += `<div class="m-banner warn"><div class="mb-icon">⚠️</div><div class="mb-body"><b>${m.lastBackup ? 'Time for a fresh backup' : 'No backup yet'}</b><div>Your data lives only on this phone. Save a copy to iCloud Drive / WhatsApp / Drive.</div>
      <div class="mb-actions"><button class="btn btn-primary btn-small" onclick="downloadBackup()">Back up now</button></div></div></div>`;
  }
  return h;
}
async function requestPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      persistedStorage = (await navigator.storage.persisted()) || (await navigator.storage.persist());
    } else persistedStorage = false;
  } catch (e) { persistedStorage = false; }
}

function makeAppIcon() {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 512, 512);
    grd.addColorStop(0, '#0f172a'); grd.addColorStop(0.6, '#1e3a5f'); grd.addColorStop(1, '#0f766e');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
    g.fillStyle = '#14b8a6';
    g.beginPath(); g.roundRect ? g.roundRect(136, 116, 240, 240, 56) : g.rect(136, 116, 240, 240); g.fill();
    g.fillStyle = '#ffffff';
    g.font = '700 170px -apple-system, "Segoe UI", Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('L', 256, 244);
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.font = '600 44px -apple-system, "Segoe UI", Arial, sans-serif';
    g.fillText('PARIMAL', 256, 420);
    const url = c.toDataURL('image/png');
    document.getElementById('touch-icon').href = url;
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = {
      name: 'Lotus Parimal Maintenance', short_name: 'Lotus Parimal',
      start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
      background_color: '#eef2f7', theme_color: '#0f172a',
      icons: [{ src: url, sizes: '512x512', type: 'image/png' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) {}
}

/* ==================================================================== */
/* ROUTING                                                              */
/* ==================================================================== */
function navigate(page) {
  state.ui.current_page = page;
  document.querySelectorAll('.nav-tab, .bn-btn').forEach(t => {
    t.classList.toggle('active', t.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + page);
  });

  if (page === 'dashboard') renderDashboard();
  else if (page === 'entry') renderEntry();
  else if (page === 'collection') renderCollection();
  else if (page === 'history') renderHistory();
  else if (page === 'readings') renderReadings();
  else if (page === 'settings') renderSettings();

  window.scrollTo(0, 0);
}

document.querySelectorAll('.nav-tab, .bn-btn').forEach(tab => {
  tab.addEventListener('click', () => navigate(tab.dataset.page));
});

/* ==================================================================== */
/* INIT                                                                 */
/* ==================================================================== */
(async function init() {
  initState();
  document.querySelector('.brand-name').textContent = state.config.society_name;
  if (state.__migrateImages) {
    delete state.__migrateImages;
    await persistAllImages();
    saveState();               // rewrites localStorage without the photos
  } else {
    await loadImagesFromDB();
  }
  navigate('dashboard');
  makeAppIcon();
  requestPersist();
  console.log('Lotus Parimal Maintenance Tracker · ready');
})();
</script>
